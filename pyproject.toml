[project]
name = "pyentrp"
description = "A Python library for computing entropy measures for time series analysis."
authors = [
  { name = "Nikolay Donets", email = "nd@donets.org" }
]
maintainers = [
  { name = "Nikolay Donets", email = "nd@donets.org" }
]
license = "Apache-2.0"
readme = "README.md"
keywords = [
  "entropy",
  "time series",
  "complexity",
  "sample entropy",
  "permutation entropy",
  "fuzzy entropy",
  "dispersion entropy",
  "multiscale entropy",
  "composite multiscale entropy",
  "refined composite multiscale entropy",
]
dynamic = ["version", "dependencies", "requires-python", "classifiers"]

[project.urls]
Homepage = "https://github.com/nikdon/pyEntropy"
Repository = "https://github.com/nikdon/pyEntropy"
Issues = "https://github.com/nikdon/pyEntropy/issues"
Changelog = "https://github.com/nikdon/pyEntropy/blob/master/CHANGELOG.md"

[tool.poetry]
version = "2.3.0"
packages = [
  { include = "pyentrp" }
]
# Python version classifiers are added from the python dependency below
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
numpy = ">=1.26,<3.0"


[tool.poetry.group.dev.dependencies]
codecov = "^2.1.13"
commitizen = ">=4.19.0,<5.0.0"
coverage = {version = "^7.10.7", extras = ["toml"]}
pre-commit = ">=3.3.2,<5.0.0"
ruff = ">=0.17.2,<0.17.3"
pyrefly = "1.4.0"


[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_type = "pep440"
version_provider = "poetry"
update_changelog_on_bump = true
version_files = [
    "CITATION.cff:^version"
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pyrefly]
project-includes = ["pyentrp"]
python-version = "3.10"
preset = "default"

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 120
target-version = "py310"
fix = true

[tool.ruff.lint]
unfixable = []
select = [
  # isort
  "I",
  # pyflakes
  "F",
  # pycodestyle
  "E", "W",
  # flake8-2020
  "YTT",
  # flake8-bugbear
  "B",
  # flake8-quotes
  "Q",
  # flake8-debugger
  "T10",
  # flake8-gettext
  "INT",
  # pylint
  "PLC", "PLE", "PLR", "PLW",
  # misc lints
  "PIE",
  # flake8-pyi
  "PYI",
  # tidy imports
  "TID",
  # implicit string concatenation
  "ISC",
  # type-checking imports
  "TCH",
  # comprehensions
  "C4",
  # pygrep-hooks
  "PGH",
  # Ruff-specific rules
  "RUF",
  # NumPy-specific rules
  "NPY",
  # pydocstyle
  "D",
]
ignore = [
  "D100", "D104",
  "D203", "D213",
  "PLR2004"
]

[tool.ruff.lint.pylint]
max-positional-args = 6

[tool.ruff.lint.per-file-ignores]
"**/{tests}/*" = ["D101", "D102", "D103"]
